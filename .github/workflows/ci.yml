name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test & Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm test

      - name: Build Application Bundle
        run: npm run build

      - name: Audit Third-Party Licenses
        run: npm run audit:licenses

      - name: Build & Validate Browser Companion
        run: |
          npm run companion:build
          npm run companion:validate

      - name: Validate Release Readiness & Source Privacy
        run: npm run release:check

      # Windows-Specific Packaging & Native Runtime Smoke Validation (V3-84)
      - name: Windows Native Runtime Rebuild & Smoke Test
        if: matrix.os == 'windows-latest'
        run: |
          npx electron-builder install-app-deps
          npx electron scripts/windows-runtime-smoke.cjs
        env:
          ELECTRON_RUN_AS_NODE: "1"

      - name: Build Windows Release Candidate Package
        if: matrix.os == 'windows-latest'
        run: |
          npx electron-builder --win portable --publish never
          node scripts/generate-portable-metadata.cjs dist-desktop
        env:
          GH_TOKEN: ""

      - name: Verify Windows Packaged Runtime
        if: matrix.os == 'windows-latest'
        run: node scripts/verify-package-runtime.cjs

      - name: Validate Windows Update Artifacts
        if: matrix.os == 'windows-latest'
        run: node scripts/validate-update-artifacts.cjs dist-desktop

      - name: Upload Windows Runtime Validation Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-report
          path: |
            windows-runtime-report.json
            dist-desktop/*portable.exe
          if-no-files-found: warn
          retention-days: 7

  prepare-release:
    name: Prepare Automatic Release
    needs: [test-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      target_sha: ${{ github.sha }}
    steps:
      - name: Checkout Successful Main Build
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Read Package SemVer
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "Detected package version: ${VERSION}"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  publish-release:
    name: Build & Publish SemVer Release
    needs: [prepare-release]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
      target_sha: ${{ needs.prepare-release.outputs.target_sha }}

