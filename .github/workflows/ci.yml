name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      desktop_changed: ${{ steps.classify.outputs.desktop_changed }}
      companion_changed: ${{ steps.classify.outputs.companion_changed }}
      package_sensitive: ${{ steps.classify.outputs.package_sensitive }}
      updater_changed: ${{ steps.classify.outputs.updater_changed }}
      non_runtime_only: ${{ steps.classify.outputs.non_runtime_only }}
      release_candidate: ${{ steps.classify.outputs.release_candidate }}
    steps:
      - name: Checkout Full History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify Changed Paths and Release Eligibility
        id: classify
        run: node scripts/classify-workflow-changes.cjs diff "$BASE_SHA" "$GITHUB_SHA" "$EVENT_NAME"
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}

  test-matrix:
    name: Test & Validate (${{ matrix.os }})
    needs: [detect-changes]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Read Electron Version
        id: electron-version
        shell: bash
        run: |
          electron_version="$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
          echo "version=${electron_version}" >> "$GITHUB_OUTPUT"

      - name: Cache Linux Electron Build Downloads
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}-

      - name: Cache Windows Electron Build Downloads
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\electron-cache
            ${{ runner.temp }}\electron-builder-cache
          key: ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}-

      - name: Install Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm ci
        env:
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

      - name: Install Dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: npm ci
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache

      - name: Run Typecheck
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm test

      - name: Build Application Bundle
        if: matrix.os == 'ubuntu-latest'
        run: npm run build

      - name: Audit Third-Party Licenses
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit:licenses

      - name: Build & Validate Browser Companion
        if: matrix.os == 'ubuntu-latest' && (needs.detect-changes.outputs.companion_changed == 'true' || needs.detect-changes.outputs.release_candidate == 'true')
        run: |
          npm run companion:build
          npm run companion:validate

      - name: Validate Release Readiness & Source Privacy
        if: matrix.os == 'ubuntu-latest'
        run: npm run release:check

      # Windows-Specific Packaging & Native Runtime Smoke Validation (V3-84)
      - name: Windows Native Runtime Rebuild & Smoke Test
        if: matrix.os == 'windows-latest'
        run: |
          npx electron scripts/windows-runtime-smoke.cjs
        env:
          ELECTRON_RUN_AS_NODE: "1"
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache

      - name: Build Frontend for Windows Package Smoke
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request' && needs.detect-changes.outputs.package_sensitive == 'true'
        run: npm run build

      - name: Package Linux Smoke AppImage
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && needs.detect-changes.outputs.package_sensitive == 'true'
        run: npx electron-builder --linux AppImage --publish never
        env:
          GH_TOKEN: ""

      - name: Verify Linux Smoke Package
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && needs.detect-changes.outputs.package_sensitive == 'true'
        run: |
          npm run package:verify
          npm run package:inspect
          node scripts/validate-update-artifacts.cjs dist-desktop

      - name: Package Windows Smoke Portable
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request' && needs.detect-changes.outputs.package_sensitive == 'true'
        run: |
          npx electron-builder --win portable --publish never
          node scripts/generate-portable-metadata.cjs dist-desktop
        env:
          GH_TOKEN: ""

      - name: Verify Windows Packaged Runtime
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request' && needs.detect-changes.outputs.package_sensitive == 'true'
        run: |
          npm run package:verify
          npm run package:inspect

      - name: Validate Windows Update Artifacts
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request' && needs.detect-changes.outputs.package_sensitive == 'true'
        run: node scripts/validate-update-artifacts.cjs dist-desktop

      - name: Upload Linux Package Smoke Artifact
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && needs.detect-changes.outputs.package_sensitive == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: linux-package-smoke-${{ github.event.pull_request.number }}
          path: dist-desktop/*.AppImage
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows Package Smoke Artifact
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request' && needs.detect-changes.outputs.package_sensitive == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-package-smoke-${{ github.event.pull_request.number }}
          path: |
            dist-desktop/*portable.exe
          if-no-files-found: error
          retention-days: 1

      - name: Stage Validated Release Build Inputs
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && needs.detect-changes.outputs.release_candidate == 'true'
        run: |
          mkdir -p .release-inputs/frontend/payload .release-inputs/companion/payload
          cp -a dist/. .release-inputs/frontend/payload/
          cp -a browser-companion/dist/. .release-inputs/companion/payload/
          node scripts/workflow-artifacts.cjs create-input .release-inputs/frontend frontend universal
          node scripts/workflow-artifacts.cjs create-input .release-inputs/companion companion universal

      - name: Upload Validated Frontend Build
        id: upload-frontend
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && needs.detect-changes.outputs.release_candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rt-library-frontend-${{ github.sha }}
          path: .release-inputs/frontend/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload Validated Browser Companion Build
        id: upload-companion
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && needs.detect-changes.outputs.release_candidate == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rt-library-companion-build-${{ github.sha }}
          path: .release-inputs/companion/**
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    name: Prepare Automatic Release
    needs: [detect-changes, test-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.release_candidate == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      target_sha: ${{ github.sha }}
    steps:
      - name: Checkout Successful Main Build
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Read Package SemVer
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "Detected package version: ${VERSION}"
          node scripts/validate-release-version.cjs "v${VERSION}"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  publish-release:
    name: Build & Publish SemVer Release
    needs: [prepare-release]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.prepare-release.outputs.release_tag }}
      target_sha: ${{ needs.prepare-release.outputs.target_sha }}

