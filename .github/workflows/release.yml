name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_call:
    inputs:
      release_tag:
        description: SemVer tag derived from package.json after a successful main CI run.
        required: true
        type: string
      target_sha:
        description: Exact main commit that passed CI and will be released.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # 0. Conventional Commit Release Eligibility Gate
  # ----------------------------------------------------------------------------
  release-eligibility:
    name: Check Release Commit Types
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.classify.outputs.should_release }}
      release_tag: ${{ steps.classify.outputs.release_tag }}
      target_sha: ${{ steps.classify.outputs.target_sha }}
    steps:
      - name: Checkout Full History
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Classify Conventional Commits since previous release
        id: classify
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          IS_AUTOMATIC_RELEASE: ${{ inputs.target_sha != '' }}
        run: |
          set -euo pipefail

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

          previous_tag="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 "${TARGET_SHA}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            commit_range="${previous_tag}..${TARGET_SHA}"
            echo "Checking commits since ${previous_tag}."
          else
            commit_range="${TARGET_SHA}"
            echo "No previous release tag found; checking repository history."
          fi

          classification="$(node scripts/classify-workflow-changes.cjs release "${TARGET_SHA}")"
          should_release="${classification#release_candidate=}"

          if [[ "$should_release" == false ]]; then
            echo "No release-triggering Conventional Commit with application code changes found."
          else
            release_version="${RELEASE_TAG#v}"
            if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Release tag '${RELEASE_TAG}' is not strict SemVer (vMAJOR.MINOR.PATCH)."
              exit 1
            fi

            if [[ -n "$previous_tag" ]]; then
              previous_version="${previous_tag#v}"
              latest_version="$(printf '%s\n%s\n' "$previous_version" "$release_version" | sort -V | tail -n 1)"
              if [[ "$release_version" == "$previous_version" || "$latest_version" != "$release_version" ]]; then
                echo "::error::Version ${release_version} must be greater than the previous release ${previous_version}. Bump package.json and package-lock.json before merging release-worthy changes."
                exit 1
              fi
            fi

            if [[ "${IS_AUTOMATIC_RELEASE}" == 'true' ]] && git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              existing_tag_target="$(git rev-parse "${RELEASE_TAG}^{commit}")"
              if [[ "$existing_tag_target" != "$TARGET_SHA" ]]; then
                echo "::error::Release tag ${RELEASE_TAG} already points to ${existing_tag_target}, not ${TARGET_SHA}. Increment the package version for the next release."
                exit 1
              fi
              echo "Release tag ${RELEASE_TAG} already points to this commit; continuing to allow a safe workflow rerun."
            fi
          fi

          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------------------
  # 1. Validation Gate
  # ----------------------------------------------------------------------------
  validate:
    name: Validate Release Criteria & Privacy
    needs: [release-eligibility]
    if: needs.release-eligibility.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-eligibility.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        if: inputs.target_sha == ''
        run: npm ci

      - name: Run Test Suite
        if: inputs.target_sha == ''
        run: npm test

      - name: Build Frontend Bundle
        if: inputs.target_sha == ''
        run: npm run build

      - name: Audit Third-Party Licenses
        if: inputs.target_sha == ''
        run: npm run audit:licenses

      - name: Run Publication Readiness & Privacy Scanner
        if: inputs.target_sha == ''
        run: npm run release:check

      - name: Build & Validate Browser Companion
        if: inputs.target_sha == ''
        run: |
          npm run companion:build
          npm run companion:validate

      - name: Validate Semantic Versioning & Tag Consistency
        run: node scripts/validate-release-version.cjs "${{ needs.release-eligibility.outputs.release_tag }}"

      - name: Stage Validated Build Inputs for Manual Tag Release
        if: inputs.target_sha == ''
        run: |
          mkdir -p .release-inputs/frontend/payload .release-inputs/companion/payload
          cp -a dist/. .release-inputs/frontend/payload/
          cp -a browser-companion/dist/. .release-inputs/companion/payload/
          node scripts/workflow-artifacts.cjs create-input .release-inputs/frontend frontend universal
          node scripts/workflow-artifacts.cjs create-input .release-inputs/companion companion universal

      - name: Upload Validated Frontend Build
        if: inputs.target_sha == ''
        uses: actions/upload-artifact@v7
        with:
          name: rt-library-frontend-${{ needs.release-eligibility.outputs.target_sha }}
          path: .release-inputs/frontend/**
          if-no-files-found: error
          retention-days: 5

      - name: Upload Validated Browser Companion Build
        if: inputs.target_sha == ''
        uses: actions/upload-artifact@v7
        with:
          name: rt-library-companion-build-${{ needs.release-eligibility.outputs.target_sha }}
          path: .release-inputs/companion/**
          if-no-files-found: error
          retention-days: 5

  # ----------------------------------------------------------------------------
  # 2. Linux AppImage Build
  # ----------------------------------------------------------------------------
  build-linux:
    name: Build Linux AppImage
    needs: [validate, release-eligibility]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-eligibility.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Read Electron Version
        id: electron-version
        shell: bash
        run: |
          electron_version="$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
          echo "version=${electron_version}" >> "$GITHUB_OUTPUT"

      - name: Cache Electron Build Downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}-

      - name: Install Dependencies
        run: npm ci
        env:
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

      - name: Download Validated Frontend Build
        uses: actions/download-artifact@v8
        with:
          name: rt-library-frontend-${{ needs.release-eligibility.outputs.target_sha }}
          path: .release-inputs/frontend

      - name: Verify Frontend Build Provenance and Restore Output
        run: |
          node scripts/workflow-artifacts.cjs verify-input .release-inputs/frontend frontend "${RELEASE_COMMIT}" "${RELEASE_TAG}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
          mkdir -p dist
          cp -a .release-inputs/frontend/payload/. dist/
        env:
          RELEASE_COMMIT: ${{ needs.release-eligibility.outputs.target_sha }}
          RELEASE_TAG: ${{ needs.release-eligibility.outputs.release_tag }}

      - name: Package Linux Desktop AppImage
        run: npx electron-builder --linux AppImage --publish never
        env:
          # Prevent electron-builder from attempting auto-publish when a tag is detected
          GH_TOKEN: ""
          ELECTRON_CACHE: ~/.cache/electron
          ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

      - name: Verify Packaged Runtime Integrity
        run: npm run package:verify

      - name: Inspect Packaged Archive Contents
        run: npm run package:inspect

      - name: Validate Update Metadata Artifacts
        run: node scripts/validate-update-artifacts.cjs dist-desktop "${RELEASE_TAG#v}"
        env:
          RELEASE_TAG: ${{ needs.release-eligibility.outputs.release_tag }}

      - name: Upload Linux AppImage & Update Artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: rt-library-linux-${{ needs.release-eligibility.outputs.release_tag }}
          path: |
            dist-desktop/*.AppImage
            dist-desktop/latest-linux.yml
            dist-desktop/*.blockmap
          if-no-files-found: error
          retention-days: 5

  # ----------------------------------------------------------------------------
  # 3. Windows NSIS Installer Build
  # ----------------------------------------------------------------------------
  build-windows:
    name: Build Windows Portable Executable
    needs: [validate, release-eligibility]
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-eligibility.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Read Electron Version
        id: electron-version
        shell: bash
        run: |
          electron_version="$(node -p "require('./package-lock.json').packages['node_modules/electron'].version")"
          echo "version=${electron_version}" >> "$GITHUB_OUTPUT"

      - name: Cache Electron Build Downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}\electron-cache
            ${{ runner.temp }}\electron-builder-cache
          key: ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-${{ steps.electron-version.outputs.version }}-

      - name: Install Dependencies
        run: npm ci
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache

      - name: Download Validated Frontend Build
        uses: actions/download-artifact@v8
        with:
          name: rt-library-frontend-${{ needs.release-eligibility.outputs.target_sha }}
          path: .release-inputs/frontend

      - name: Verify Frontend Build Provenance and Restore Output
        shell: bash
        run: |
          node scripts/workflow-artifacts.cjs verify-input .release-inputs/frontend frontend "$RELEASE_COMMIT" "$RELEASE_TAG" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          mkdir -p dist
          cp -a .release-inputs/frontend/payload/. dist/
        env:
          RELEASE_COMMIT: ${{ needs.release-eligibility.outputs.target_sha }}
          RELEASE_TAG: ${{ needs.release-eligibility.outputs.release_tag }}

      - name: Package Windows Portable Executable
        run: |
          npx electron-builder --win portable --publish never
          node scripts/generate-portable-metadata.cjs dist-desktop
        env:
          # Prevent electron-builder from attempting auto-publish when a tag is detected
          GH_TOKEN: ""
          ELECTRON_CACHE: ${{ runner.temp }}\electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache

      - name: Verify Packaged Runtime Integrity
        run: npm run package:verify

      - name: Inspect Packaged Archive Contents
        run: npm run package:inspect

      - name: Validate Update Metadata Artifacts
        run: node scripts/validate-update-artifacts.cjs dist-desktop "${RELEASE_TAG#v}"
        env:
          RELEASE_TAG: ${{ needs.release-eligibility.outputs.release_tag }}

      - name: Upload Windows Portable & Update Artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: rt-library-windows-${{ needs.release-eligibility.outputs.release_tag }}
          path: |
            dist-desktop/*portable.exe
            dist-desktop/latest.yml
          if-no-files-found: error
          retention-days: 5

  # ----------------------------------------------------------------------------
  # 4. Browser Companion Extension Package
  # ----------------------------------------------------------------------------
  package-companion:
    name: Package Browser Companion
    needs: [validate, release-eligibility]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-eligibility.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Download Validated Browser Companion Build
        uses: actions/download-artifact@v8
        with:
          name: rt-library-companion-build-${{ needs.release-eligibility.outputs.target_sha }}
          path: .release-inputs/companion

      - name: Verify Companion Build Provenance and Restore Output
        run: |
          node scripts/workflow-artifacts.cjs verify-input .release-inputs/companion companion "${RELEASE_COMMIT}" "${RELEASE_TAG}" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
          mkdir -p browser-companion/dist
          cp -a .release-inputs/companion/payload/. browser-companion/dist/
        env:
          RELEASE_COMMIT: ${{ needs.release-eligibility.outputs.target_sha }}
          RELEASE_TAG: ${{ needs.release-eligibility.outputs.release_tag }}

      - name: Package Browser Companion Archive
        run: |
          mkdir -p dist-companion
          node scripts/package-browser-companion.cjs dist-companion --skip-build

      - name: Upload Browser Companion Artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: rt-library-companion-${{ needs.release-eligibility.outputs.release_tag }}
          path: dist-companion/rt-library-browser-companion-*.zip
          if-no-files-found: error
          retention-days: 5

  # ----------------------------------------------------------------------------
  # 5. GitHub Release & Checksums Deployment
  # ----------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [validate, release-eligibility, build-linux, build-windows, package-companion]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-eligibility.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Create Release Assets Directory
        run: mkdir -p release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v8
        with:
          name: rt-library-linux-${{ needs.release-eligibility.outputs.release_tag }}
          path: release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v8
        with:
          name: rt-library-windows-${{ needs.release-eligibility.outputs.release_tag }}
          path: release-assets

      - name: Download Browser Companion Artifact
        uses: actions/download-artifact@v8
        with:
          name: rt-library-companion-${{ needs.release-eligibility.outputs.release_tag }}
          path: release-assets

      - name: Verify Release Assets Set
        run: |
          echo "=== RELEASE ARTIFACTS INVENTORY ==="
          ls -la release-assets
          
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          export EXPECTED_VERSION
          echo "Expected Version: ${EXPECTED_VERSION}"
          
          APPIMAGE_COUNT=$(ls -1 release-assets/RT-Library-${EXPECTED_VERSION}-linux-*.AppImage 2>/dev/null | wc -l)
          EXE_COUNT=$(ls -1 release-assets/RT-Library-${EXPECTED_VERSION}-windows-*.exe 2>/dev/null | wc -l)
          COMPANION_COUNT=$(ls -1 release-assets/rt-library-browser-companion-v${EXPECTED_VERSION}.zip 2>/dev/null | wc -l)
          LATEST_LINUX_COUNT=$(ls -1 release-assets/latest-linux.yml 2>/dev/null | wc -l)
          LATEST_WIN_COUNT=$(ls -1 release-assets/latest.yml 2>/dev/null | wc -l)
          
          if [ "$APPIMAGE_COUNT" -ne 1 ]; then
            echo "❌ Error: Expected exactly 1 Linux AppImage matching version ${EXPECTED_VERSION}, found ${APPIMAGE_COUNT}"
            exit 1
          fi
          
          if [ "$EXE_COUNT" -ne 1 ]; then
            echo "❌ Error: Expected exactly 1 Windows setup EXE matching version ${EXPECTED_VERSION}, found ${EXE_COUNT}"
            exit 1
          fi

          if [ "$COMPANION_COUNT" -ne 1 ]; then
            echo "❌ Error: Expected exactly 1 Browser Companion zip matching version ${EXPECTED_VERSION}, found ${COMPANION_COUNT}"
            exit 1
          fi

          if [ "$LATEST_LINUX_COUNT" -ne 1 ]; then
            echo "❌ Error: Expected exactly 1 latest-linux.yml update metadata file, found ${LATEST_LINUX_COUNT}"
            exit 1
          fi

          if [ "$LATEST_WIN_COUNT" -ne 1 ]; then
            echo "❌ Error: Expected exactly 1 latest.yml update metadata file, found ${LATEST_WIN_COUNT}"
            exit 1
          fi

          # Validate update artifacts integrity
          node scripts/validate-update-artifacts.cjs release-assets "${EXPECTED_VERSION}"
          
          # Rigorous check for disallowed data, secrets, databases, or cookies
          FORBIDDEN_FILES=$(find release-assets/ -type f \( \
            -name "*.sqlite*" -o \
            -name "*.db*" -o \
            -name "*.torrent*" -o \
            -name "cookies*" -o \
            -name "storageState*" -o \
            -name "*.env*" -o \
            -name "*.pem*" -o \
            -name "*.key*" -o \
            -name "*.log" \
          \))
          
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "❌ Error: Forbidden sensitive/database files detected in release assets:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          
          echo "✅ Release assets inventory verified successfully (AppImage, Portable exe, Companion zip, latest metadata, 0 forbidden files)."
        env:
          RELEASE_TAG: ${{ needs.release-eligibility.outputs.release_tag }}

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum RT-Library-*.AppImage RT-Library-*.exe rt-library-browser-companion-*.zip > SHA256SUMS.txt
          
          CHECKSUM_ENTRIES=$(wc -l < SHA256SUMS.txt)
          if [ "$CHECKSUM_ENTRIES" -ne 3 ]; then
            echo "❌ Error: Expected exactly 3 checksum entries in SHA256SUMS.txt, found ${CHECKSUM_ENTRIES}"
            exit 1
          fi
          
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Create Release Provenance Manifest
        run: node scripts/workflow-artifacts.cjs create-release release-assets
        env:
          RELEASE_COMMIT: ${{ needs.release-eligibility.outputs.target_sha }}
          RELEASE_VERSION: ${{ needs.release-eligibility.outputs.release_tag }}
          LINUX_ARTIFACT_ID: ${{ needs.build-linux.outputs.artifact_id }}
          WINDOWS_ARTIFACT_ID: ${{ needs.build-windows.outputs.artifact_id }}
          COMPANION_ARTIFACT_ID: ${{ needs.package-companion.outputs.artifact_id }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: RT-Library ${{ needs.release-eligibility.outputs.release_tag }}
          tag_name: ${{ needs.release-eligibility.outputs.release_tag }}
          target_commitish: ${{ needs.release-eligibility.outputs.target_sha }}
          files: |
            release-assets/*.AppImage
            release-assets/*portable.exe
            release-assets/rt-library-browser-companion-*.zip
            release-assets/latest-linux.yml
            release-assets/latest.yml
            release-assets/*.blockmap
            release-assets/SHA256SUMS.txt
            release-assets/release-manifest.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
